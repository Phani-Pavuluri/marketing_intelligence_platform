[tool.poetry]
name = "mip"
version = "0.1.0"
description = "Causal marketing intelligence operating system"
authors = []
readme = "README.md"
packages = [{ include = "mip", from = "src" }]

[tool.poetry.dependencies]
python = ">=3.11,<4.0"
pydantic = "^2.0"
pandas = "^2.0"
numpy = "^2.0"

[tool.poetry.scripts]
mip-demo = "mip.cli.demo:main"

[tool.poetry.group.dev.dependencies]
pytest = "^8.0"
ruff = "^0.8"
mypy = "^1.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["mip"]
mypy_path = "src"
