[tool.poetry]
name = "mip"
version = "0.1.0"
description = "Causal marketing intelligence operating system"
authors = []
readme = "README.md"
packages = [{ include = "mip", from = "src" }, { include = "app" }]

[tool.poetry.dependencies]
python = ">=3.11,<4.0"
pydantic = "^2.0"
pandas = "^2.0"
numpy = "^2.0"
streamlit = "^1.40"
fastapi = ">=0.115,<1.0"
uvicorn = ">=0.32,<1.0"

[tool.poetry.scripts]
mip-demo = "mip.cli.demo:main"
# Legacy Phase 5D JSON workflow shell; canonical demo: streamlit run app/streamlit_app.py
mip-app = "mip.app.streamlit_app:main"

[tool.poetry.group.dev.dependencies]
pytest = "^8.0"
ruff = "^0.8"
mypy = "^1.0"
httpx = ">=0.27,<1.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests", "app"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["mip"]
mypy_path = "src"
